<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>To-Do List</h1>

    <input type="text" id="input-tugas" placeholder="Masukkan tugas...">
    <button id="btn-tambah">Tambah</button>

    <p id="pesan-peringatan"></p>

    <ul id="daftar-tugas">
    </ul>

    <h2>Keterangan Tugas</h2>

    <p>Total Tugas: <span id="total-tugas">0</span></p>
    <p>Selesai: <span id="tugas-selesai">0</span></p>
    <p>Belum Selesai: <span id="tugas-belum-selesai">0</span></p>

    <script src="app.js"></script>
</body>
</html>
