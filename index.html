<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>To-Do List</h1>

    <div class="input-area">
        <input type="text" id="input-tugas" placeholder="Masukkan tugas...">
        <button id="btn-tambah">Tambah</button>
    </div>

    <p id="pesan-peringatan"></p>

    <div class="konten">

        <div class="daftar-area">
            <h2>Daftar Tugas</h2>

            <ul id="daftar-tugas">
            </ul>
        </div>

        <div id="statistik">
            <h2>Keterangan Tugas</h2>

            <p>Total Tugas: <span id="total-tugas">0</span></p>
            <p>Selesai: <span id="tugas-selesai">0</span></p>
            <p>Belum Selesai: <span id="tugas-belum-selesai">0</span></p>
        </div>

    </div>

    <script src="app.js"></script>

</body>

</html>
